services:
  api:
    build: .
    command: ["python", "-m", "projectbot.api"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  bot:
    build: .
    command: ["python", "-m", "projectbot.bot"]
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: ["python", "-m", "projectbot.worker"]
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projectbot
      POSTGRES_USER: projectbot
      POSTGRES_PASSWORD: projectbot
    volumes:
      - projectbot_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - projectbot_redis:/data

volumes:
  projectbot_db:
  projectbot_redis:
