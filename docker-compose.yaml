services:
  api:
    build: .
    command: ["python", "-m", "projectbot.api"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://projectbot:projectbot@db:5432/projectbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-5}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  bot:
    build: .
    command: ["python", "-m", "projectbot.bot"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://projectbot:projectbot@db:5432/projectbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-5}
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: ["python", "-m", "projectbot.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://projectbot:projectbot@db:5432/projectbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-5}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectbot}
      POSTGRES_USER: ${POSTGRES_USER:-projectbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectbot}
    volumes:
      - projectbot_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - projectbot_redis:/data

volumes:
  projectbot_db:
  projectbot_redis:
